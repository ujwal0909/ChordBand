name: chordband
description: "ChordBand - Real-time Chords, Transposition & Collaborative Songbook for Musicians and Bands"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Pure Dart Chord & Transposition Engine
  chord_engine:
    path: ../packages/chord_engine

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local Offline SQLite Database (Drift)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Platform & Hardware Integration
  wakelock_plus: ^1.2.5
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  characters: ^1.3.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0
  file_picker: ^8.0.5

  cupertino_icons: ^1.0.8
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.2.0
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  msix: ^3.16.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/seed_songs/
    - assets/fonts/

  fonts:
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700

msix_config:
  display_name: ChordBand
  publisher_display_name: ChordBand Studio
  identity_name: ChordBand.MusicSheet
  msix_version: 1.0.0.0
  capabilities: internetClient
