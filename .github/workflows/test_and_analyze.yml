name: Test & Analyze

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_chord_engine:
    name: Pure Dart Chord Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        working-directory: packages/chord_engine
        run: dart pub get
      - name: Run Chord Engine Unit Tests
        working-directory: packages/chord_engine
        run: dart test

  test_app:
    name: Flutter App Analyze & Tests
    runs-on: ubuntu-latest
    needs: test_chord_engine
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Verify Analyzer
        working-directory: app
        run: flutter analyze
      - name: Run Widget & Logic Tests
        working-directory: app
        run: flutter test
